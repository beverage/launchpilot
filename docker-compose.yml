# Manifeste pour Aiven Runtime (Deploy application > Scan).
# Les secrets se renseignent dans la configuration de l'application Aiven, jamais dans ce fichier :
#   DATABASE_URL       = Service URI du PostgreSQL Aiven
#   ANTHROPIC_API_KEY  = clé API Claude (sans elle, les agents tournent en mode règles)
#   CLAUDE_MODEL       = optionnel (défaut claude-sonnet-5-5)
services:
  launchpilot:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL}
